  <header class="site-header">
    <a class="brand" href="../" data-site-link aria-label="El mundo de Fabi, elegir actividad"><img class="brand-mark" src="../assets/fabi-world.svg?v=2" width="64" height="64" alt=""><span class="brand-name">El mundo de <b>Fabi</b></span></a>
    <div class="header-actions">
      <button id="theme-toggle" class="quiet-button" type="button" aria-label="Modo oscuro" aria-pressed="false"><span id="theme-icon" aria-hidden="true">☾</span><span class="theme-label">Modo oscuro</span></button>
      <button id="sound" class="quiet-button" type="button" aria-pressed="true"><span aria-hidden="true">♫</span> <span id="sound-label">Sonido activado</span></button>
    </div>
  </header>
  <main>
    <section id="makeup" class="screen makeup-screen" aria-labelledby="makeup-title">
      <a class="studio-back" href="../" data-site-link><span aria-hidden="true">←</span> Elegir actividad</a>
      <div class="studio-heading">
        <div><h1 id="makeup-title">Estudio de <em>maquillaje</em></h1><p>Elige una muñeca y ponle nombre. Prueba maquillaje y vestuario para crear su retrato.</p></div>
        <svg class="heading-sparks" viewBox="0 0 115 65" aria-hidden="true"><use href="#spark" x="7" y="12" width="35" height="35"/><use href="#spark" x="52" y="0" width="29" height="29"/><use href="#spark" x="85" y="29" width="16" height="16"/><path d="M3 53q28 11 61-11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 6"/></svg>
      </div>
      <div class="studio-layout">
        <div class="vanity" aria-label="Espejo de maquillaje">
          <div class="vanity-stars" aria-hidden="true"><i>✦</i><i>✧</i><i>✧</i><i>✦</i><i>✧</i></div>
          <div class="mirror">
            <div class="mirror-glass">
              <div id="portrait" role="img"></div>
              <span id="tool-flash" aria-hidden="true"><svg viewBox="0 0 64 64"><use id="flash-icon" href="#kit-lips"/></svg></span>
            </div>
            <i class="bulb b1"></i><i class="bulb b2"></i><i class="bulb b3"></i><i class="bulb b4"></i><i class="bulb b5"></i><i class="bulb b6"></i><i class="bulb b7"></i>
          </div>
          <div class="vanity-table" aria-hidden="true"></div>
          <svg class="dresser-tools" viewBox="0 0 400 94" aria-hidden="true">
            <g transform="translate(6 11)"><use href="#kit-cheeks" x="18" y="-9" width="60" height="70" transform="rotate(-35 47 30)"/><use href="#kit-cheeks" x="40" y="-12" width="52" height="64" transform="rotate(-5 65 28)"/><path d="M31 37q27-4 53 0l-6 37q-22 9-41 0Z" fill="#dfa0b6" stroke="#955d7a" stroke-width="2"/><path d="m39 43 4 25m4-24 2 26m8-26v27m9-28-2 26m10-26-3 25" fill="none" stroke="#f4c6d2" stroke-width="3"/></g>
            <use href="#kit-eyes" x="315" y="29" width="70" height="61" transform="rotate(7 350 59)"/>
            <use href="#kit-lips" x="292" y="37" width="35" height="47" transform="rotate(-20 310 60)"/>
          </svg>
          <div class="mirror-name"><span aria-hidden="true">✧</span> <strong id="mirror-name">Luna</strong> <span aria-hidden="true">✧</span></div>
        </div>
        <div class="kit">
          <div class="kit-heading"><h2>Mi estuche</h2><button id="undo" class="undo" type="button" disabled><span aria-hidden="true">↶</span> Deshacer</button></div>
          <h3 id="dolls-title">Muñecas</h3>
          <div id="dolls" class="dolls" role="group" aria-labelledby="dolls-title"></div>
          <form id="name-form" class="name-form">
            <label for="doll-name">Nombre de tu muñeca</label>
            <input type="text" id="doll-name" name="nombre" maxlength="24" autocomplete="off" enterkeyhint="done">
            <button type="submit">Guardar nombre</button>
          </form>
          <div id="sections" class="kit-sections" role="group" aria-label="Secciones del estuche">
            <button type="button" data-section="makeup" aria-pressed="true">Maquillaje</button>
            <button type="button" data-section="style" aria-pressed="false">Vestuario</button>
          </div>
          <h3 id="tools-title" class="visually-hidden">Elige una herramienta</h3>
          <div id="tools" class="tools" role="group" aria-labelledby="tools-title"></div>
          <div class="palette-heading">
            <h3 id="palette-title">Color de labios</h3>
            <button id="clear-choice" type="button" disabled>Quitar</button>
          </div>
          <div id="palette" class="palette" role="group" aria-labelledby="palette-title"></div>
          <button id="finish" class="studio-primary" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#camera"/></svg> Ver mi retrato</button>
        </div>
      </div>
      <p id="studio-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
    </section>
  </main>
  <dialog id="photo-dialog" aria-labelledby="photo-title">
    <div class="photo-heading"><h2 id="photo-title">Mi retrato</h2><button id="close-photo" type="button" aria-label="Cerrar retrato">×</button></div>
    <div id="postcard" role="img"></div>
    <button id="save" class="studio-primary" type="button">Guardar imagen</button>
    <button id="edit" class="edit-photo" type="button">Seguir maquillando</button>
    <p id="photo-status" role="status"></p>
  </dialog>
  <footer><span class="footer-flower" aria-hidden="true">✿</span><span>Hecho para aprender con una sonrisa</span></footer>
